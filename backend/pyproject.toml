[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "django>=6.0.4",
    "django-unfold>=0.89.0",
    "fastapi>=0.135.3",
    "psycopg[binary]>=3.2.9",
    "uvicorn[standard]>=0.44.0",
    "whitenoise>=6.9.0",
]

[dependency-groups]
dev = [
    "bandit>=1.9.4",
    "django-stubs>=6.0.3",
"mypy>=1.15.0",
    "pre-commit>=4.6.0",
    "pytest>=9.0.3",
    "pytest-cov>=6.0.0",
    "ruff>=0.15.10",
]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # isort — imports ordening
    "B",    # flake8-bugbear — detects common bugs
    "SIM",  # flake8-simplify — simplify complex code
    "UP",   # pyupgrade — modernize syntax automatically
    "TCH",  # flake8-type-checking — Moves imports to  TYPE_CHECKING blocks
    "RUF",  # ruff rules
]
ignore = ["E501", "RUF012", "B008"]

[tool.ruff.format]
quote-style = "double"

[tool.bandit]
exclude_dirs = [".venv", "migrations", "tests"]

[tool.coverage.run]
omit = [
    "*/.venv/*",
    "*/tests/*",
    "*/migrations/*",
    "manage.py",
]

[tool.coverage.report]
fail_under = 70

[tool.django-stubs]
django_settings_module = "config.settings"

[tool.mypy]
python_version = "3.13"
plugins = ["mypy_django_plugin.main"]
ignore_missing_imports = true
exclude = [
    "\\.venv",
    "migrations",
    "manage\\.py",
    "staticfiles",
    "tests",
]
# Adoptado incrementalmente — solo módulos listos
files = [
    "infra",
    "shared",
    "api",
    "product",
]
# Flags razonables sin strict total para no bloquear el desarrollo
disallow_untyped_defs = false
warn_return_any = false
warn_unused_ignores = true
no_implicit_optional = true
